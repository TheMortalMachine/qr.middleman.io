<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code in the Canvas of Babel</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    img {
      display: block;
      width: min(100%, 500px);
      height: auto;
      margin: 0 auto 28px;
      image-rendering: pixelated;
    }

    p {
      max-width: 650px;
      margin: 18px auto;
      line-height: 1.55;
    }

    a {
      color: #0645ad;
    }
  </style>
</head>

<body>
  <main>
    <img
      src="qr.png"
      alt="QR code that links to this page"
    >

    <p>
      <a href="qr-babel.txt" target="_blank" rel="noopener">
        Open the full Canvas of Babel location code
      </a>
    </p>

    <p>
      This page preserves the exact QR image and its full Canvas of Babel
      location code as separate files because the official Canvas of Babel
      bookmark-link service was unavailable.
    </p>

    <p>
      <a href="https://babelia.libraryofbabel.info/" target="_blank" rel="noopener">
        Babel Image Archives
      </a>
    </p>
  </main>
</body>
</html>
